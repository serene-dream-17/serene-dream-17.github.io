<html lang="zh-CN">
<head>

<title>计算机知识全景图</title>
<style>
:root{
  --bg:#f5f7fb;--surface:#fff;--surface-2:#f0f3f8;--text:#1d2636;
  --muted:#6b7688;--line:#e2e7ef;--accent:#4263eb;--accent-soft:#edf0ff;
  --shadow:0 8px 28px rgba(28,42,70,.06);--radius:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1440px;margin:0 auto;padding:28px 24px 48px}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}
.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.04em;line-height:1.15;margin:10px 0 12px}
.subtitle{max-width:740px;color:var(--muted);margin:0}
.hero-note{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px 18px;border-radius:14px;min-width:210px}
.hero-note strong{display:block;font-size:24px;letter-spacing:-.04em}
.hero-note span{color:var(--muted);font-size:13px}
.toolbar{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.9);backdrop-filter:blur(16px);padding:10px 0 16px;display:flex;gap:10px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8490a3}
input[type=search]{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px 0 42px;outline:none;color:var(--text);box-shadow:0 2px 8px rgba(28,42,70,.02)}
input[type=search]:focus{border-color:#9aa9ff;box-shadow:0 0 0 3px rgba(66,99,235,.1)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:11px;padding:10px 14px;font-weight:650;white-space:nowrap;transition:.18s}
.btn:hover{border-color:#b7c2d3;transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.sidebar{position:sticky;top:82px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.side-title{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.1em;margin:4px 8px 12px}
.nav-list{display:grid;gap:4px}
.nav-item{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:#596579;padding:9px 10px;border-radius:9px;width:100%;font-size:13px}
.nav-item:hover,.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-num{font-size:10px;font-weight:800;opacity:.7;font-variant-numeric:tabular-nums}
.main{min-width:0}
.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat .num{font-size:24px;font-weight:800;letter-spacing:-.04em}
.stat .label{font-size:12px;color:var(--muted);margin-top:2px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;scroll-margin-top:90px}
.section-head{display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;user-select:none}
.section-icon{width:42px;height:42px;display:grid;place-items:center;flex-shrink:0;border-radius:12px;background:var(--tint);color:var(--tone)}
.section-icon svg{width:21px;height:21px}
.section-heading{flex:1;min-width:0}
.section-heading h2{font-size:17px;margin:0 0 3px;letter-spacing:-.02em}
.section-heading p{font-size:12px;color:var(--muted);margin:0}
.section-count{font-size:11px;color:var(--muted);background:var(--surface-2);padding:5px 8px;border-radius:8px;white-space:nowrap}
.chevron{color:#929caf;transition:transform .2s}
.section.collapsed .chevron{transform:rotate(-90deg)}
.section-body{padding:0 20px 20px}
.section.collapsed .section-body{display:none}
.group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.group{border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(180deg,#fff,#fdfdff);min-width:0}
.group h3{font-size:13px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.group h3:before{content:"";width:6px;height:6px;border-radius:2px;background:var(--tone)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid #e7ebf3;background:#f8f9fc;color:#526076;border-radius:7px;padding:4px 8px;font-size:12px;line-height:1.5;transition:.15s;cursor:default}
.tag:hover{border-color:#b9c5ff;background:#f0f3ff;color:#354fc7}
.tag.match{border-color:#8296ff;background:#edf0ff;color:#2947d2}
.empty{display:none;text-align:center;background:var(--surface);border:1px dashed var(--line);padding:44px 20px;border-radius:var(--radius);color:var(--muted)}
.footer{padding:18px 4px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static}.nav-list{display:flex;overflow:auto;padding-bottom:3px}.nav-item{width:auto;flex-shrink:0}.side-title{display:none}.hero-note{display:none}.group-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.app{padding:20px 13px 32px}.hero{margin-bottom:18px}.toolbar{flex-wrap:wrap}.search-wrap{flex-basis:100%}.btn{flex:1;padding:9px 10px;font-size:12px}.overview{gap:7px}.stat{padding:12px 10px}.stat .num{font-size:20px}.stat .label{font-size:11px}.group-grid{grid-template-columns:1fr}.section-head{padding:15px 14px;gap:10px}.section-body{padding:0 14px 14px}.section-icon{width:38px;height:38px}.section-heading h2{font-size:15px}.section-count{display:none}}
</style>
</head>

    </main>
  </div>
</div>

const tree = document.getElementById('tree');
const nav = document.getElementById('nav');
const search = document.getElementById('search');
const empty = document.getElementById('empty');
const norm = s => s.toLocaleLowerCase().trim();
function iconSvg(name){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.layers}</svg>`;
}
function render(){
  const q=norm(search.value);
  tree.innerHTML='';nav.innerHTML='';
  let visibleDomains=0,groupsCount=0,itemsCount=0;
  data.forEach((section,idx)=>{
    const groups=section.groups.map(g=>({name:g[0],items:g[1].split('、').filter(Boolean)})).map(g=>({
      ...g,items:g.items.filter(item=>!q||norm(item).includes(q)||norm(g.name).includes(q)||norm(section.title).includes(q))
    })).filter(g=>!q||g.items.length);
    const titleMatch=q&&norm(section.title).includes(q);
    const filteredGroups=q&&!titleMatch?groups:section.groups.map(g=>({name:g[0],items:g[1].split('、').filter(Boolean)}));
    const finalGroups=q?(titleMatch?section.groups.map(g=>({name:g[0],items:g[1].split('、').filter(Boolean)})):groups):section.groups.map(g=>({name:g[0],items:g[1].split('、').filter(Boolean)}));
    const visible= !q || titleMatch || finalGroups.length>0;
    if(!visible)return;
    visibleDomains++;groupsCount+=finalGroups.length;itemsCount+=finalGroups.reduce((n,g)=>n+g.items.length,0);
    const navButton=document.createElement('button');
    navButton.className='nav-item';navButton.innerHTML=`<span class="nav-num">${String(idx+1).padStart(2,'0')}</span><span>${section.title.replace(/^\\d+\\. /,'')}</span>`;
    navButton.addEventListener('click',()=>{
      const target=document.getElementById('section-'+idx);
      if(target){target.classList.remove('collapsed');target.scrollIntoView({behavior:'smooth',block:'start'});}
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));navButton.classList.add('active');
    });
    nav.appendChild(navButton);
    const el=document.createElement('section');
    el.className='section';el.id='section-'+idx;
    if(!q && idx>2)el.classList.add('collapsed');
    el.style.setProperty('--tone',section.tone);el.style.setProperty('--tint',section.tint);
    const body=finalGroups.map(g=>{
      const tags=g.items.map(item=>{
        const isMatch=q&&norm(item).includes(q);
        return `<span class="tag ${isMatch?'match':''}" title="${item.replace(/"/g,'&quot;')}">${item}</span>`;
      }).join('');
      return `<article class="group"><h3>${g.name}</h3><div class="tags">${tags}</div></article>`;
    }).join('');
    el.innerHTML=`<div class="section-head" role="button" tabindex="0" aria-expanded="${!el.classList.contains('collapsed')}">
      <div class="section-icon">${iconSvg(section.icon)}</div>
      <div class="section-heading"><h2>${section.title}</h2><p>${section.desc}</p></div>
      <span class="section-count">${finalGroups.length} 个主题</span>
      <span class="chevron">${iconSvg('layers').replace('<svg','<svg style="width:17px;height:17px"')}</span>
    </div><div class="section-body"><div class="group-grid">${body}</div></div>`;
    const head=el.querySelector('.section-head');
    const toggle=()=>{el.classList.toggle('collapsed');head.setAttribute('aria-expanded',String(!el.classList.contains('collapsed')))};
    head.addEventListener('click',toggle);head.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
    tree.appendChild(el);
  });
  document.getElementById('domainCount').textContent=visibleDomains;
  document.getElementById('groupCount').textContent=groupsCount;
  document.getElementById('techCount').textContent=itemsCount;
  empty.style.display=visibleDomains?'none':'block';
}
search.addEventListener('input',render);
document.getElementById('expandAll').addEventListener('click',()=>document.querySelectorAll('.section').forEach(s=>s.classList.remove('collapsed')));
document.getElementById('collapseAll').addEventListener('click',()=>document.querySelectorAll('.section').forEach(s=>s.classList.add('collapsed')));
document.getElementById('clearSearch').addEventListener('click',()=>{search.value='';render();search.focus();});
render();
</script>
